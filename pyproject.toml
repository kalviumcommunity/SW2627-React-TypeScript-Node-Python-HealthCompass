[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcompass"
version = "0.1.0"
description = "Document ingestion for the HealthCompass RAG application"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
healthcompass-load = "healthcompass.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
