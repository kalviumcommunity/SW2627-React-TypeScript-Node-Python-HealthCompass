[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcompass"
version = "0.1.0"
description = "Document ingestion for the HealthCompass RAG application"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff==0.16.6"]

[project.scripts]
healthcompass-load = "healthcompass.ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
