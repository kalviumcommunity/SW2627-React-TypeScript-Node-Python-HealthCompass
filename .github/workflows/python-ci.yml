name: Python CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -e ".[dev]"

      - name: Check Python lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run unit and regression tests
        run: python -m pytest -q

      - name: Compile application
        run: python -m compileall -q src experiments

      - name: Validate application configuration
        env:
          OPENAI_BASE_URL: https://api.openai.com/v1
          OPENAI_API_KEY: ci-placeholder-key
          CHAT_MODEL: ci-chat-model
          EMBED_MODEL: ci-embedding-model
        run: python src/app.py
